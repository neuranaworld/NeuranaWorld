<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Dominion v5</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #aee0ff;
      font-family: "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
    }

    /* === Başlatma Ekranı === */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: linear-gradient(180deg, #6ab7ff, #cbeeff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 1s ease;
    }

    #loading-title {
      font-size: 2em;
      color: #003a75;
      margin-bottom: 20px;
    }

    #loading-progress {
      width: 300px;
      height: 10px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background: #0062cc;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* === Üst Menü === */
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
      text-shadow: 1px 1px 2px #000;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px;
      z-index: 5;
    }

    .hud-left, .hud-right {
      pointer-events: none;
    }

    .hud-left div, .hud-right div {
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-title">🌾 Farm Dominion v5 Yükleniyor...</div>
    <div id="loading-progress">
      <div id="loading-bar"></div>
    </div>
  </div>

  <div id="ui-overlay">
    <div class="hud-left">
      <div id="hud-pos">📍 Pozisyon: 0,0,0</div>
      <div id="hud-time">⏰ Zaman: 00:00</div>
    </div>
    <div class="hud-right">
      <div id="hud-fps">🎮 FPS: 0</div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
